[project]
name = "assignment2"
version = "0.1.0"
description = "IT6062 Assignment 02, causal inference, graph neural networks and recommender systems on dunnhumby The Complete Journey"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "ipython>=8.18",
    "jupyterlab>=4.0",
    "kaggle>=1.7",
    "matplotlib>=3.9",
    "nbclient>=0.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "torch>=2.4",
    "torch-geometric>=2.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
